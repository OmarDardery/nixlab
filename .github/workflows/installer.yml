name: Installer acceptance
on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'admin/main.py'
      - 'scripts/homelab.py'
      - 'tests/test_install_intent.py'
      - 'tests/test_direct_install.py'
      - 'tests/test_installer_workflow.py'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'admin/main.py'
      - 'scripts/homelab.py'
      - 'tests/test_install_intent.py'
      - 'tests/test_direct_install.py'
      - 'tests/test_installer_workflow.py'
      - '.github/workflows/installer.yml'
  workflow_dispatch:
permissions:
  contents: read
# Same-repository PRs already validate feature branches. Do not run the same
# expensive NixOS suite a second time for their branch push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile installer and host commands
        run: python3 -m compileall -q installer admin scripts
      - name: Verify interview, unattended answers and dangerous-network rejection
        run: python3 -m unittest discover -s tests -p test_install_intent.py -v
      - name: Verify direct host installation and upgrade invariants
        run: |
          python3 -m unittest discover -s tests -p test_direct_install.py -v
          python3 -m unittest discover -s tests -p test_installer_workflow.py -v
