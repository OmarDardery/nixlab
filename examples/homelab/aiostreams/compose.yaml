# Portainer stack inside the isolated apps VM, never on the NixLab host.
# Resolve and pin AIOSTREAMS_IMAGE to a reviewed immutable SHA-256 digest.
services:
  aiostreams:
    image: ${AIOSTREAMS_IMAGE:?Set reviewed image digest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BASE_URL: ${BASE_URL:?Set your real HTTPS application URL}
      SECRET_KEY: ${SECRET_KEY:?Set a 64-character hexadecimal secret}
      AIOSTREAMS_AUTH: ${AIOSTREAMS_AUTH:?Set account:strong-password}
      AIOSTREAMS_AUTH_REQUIRED: "true"
    volumes:
      - aiostreams_data:/app/data
    security_opt:
      - no-new-privileges:true

volumes:
  aiostreams_data:
