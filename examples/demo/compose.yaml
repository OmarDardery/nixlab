name: demo
services:
  web:
    image: nixlab-demo:1
    pull_policy: never
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_NAME: demo
      DB_USER: demo
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_HOST: redis
    secrets: [db_password]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U demo -d demo"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
  redis:
    image: redis:7-bookworm
    command: [redis-server, --save, "", --appendonly, "no"]
    restart: unless-stopped
    # Cache only. PostgreSQL is the source of truth; Redis data is intentionally disposable.
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
volumes:
  postgres-data:
secrets:
  db_password:
    file: /var/lib/nixlab-secrets/demo-db-password
